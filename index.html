<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insight | Acesso ao Sistema</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{
  min-height:100vh;color:#fff;overflow:hidden;
  background:
    radial-gradient(circle at 86% 46%,rgba(25,105,236,.35),transparent 25%),
    radial-gradient(circle at 20% 8%,rgba(16,88,194,.45),transparent 27%),
    linear-gradient(135deg,#032052 0%,#073d88 55%,#021b3e 100%);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;
  background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);
  background-size:44px 44px;
}
body:after{
  content:"";position:fixed;width:470px;height:470px;border-radius:50%;
  right:-220px;top:30%;border:105px solid rgba(26,111,240,.16);
  box-shadow:0 0 0 105px rgba(26,111,240,.08);pointer-events:none;
}
.page{
  position:relative;z-index:1;min-height:100vh;height:100vh;
  display:grid;grid-template-columns:54% 46%;align-items:start;
  padding:7vh 7vw 5vh;gap:4vw;
}
.left{min-width:0;padding-top:0}
.logo{display:block;width:clamp(250px,27vw,390px);height:auto;margin:0 0 5vh 0;filter:brightness(0) invert(1)}
.topline{font-size:12px;letter-spacing:4px;font-weight:700;color:#dbeaff;margin-top:-7vh;margin-bottom:20px}
.topline span{color:#31ddff}
h1{font-size:clamp(42px,4.5vw,68px);line-height:.98;margin:0 0 22px;font-weight:800;max-width:720px}
h1 span{color:#25dcff}
.subtitle{font-size:clamp(18px,1.6vw,24px);line-height:1.35;color:#d5e5f9;margin:0 0 35px;max-width:570px}
.features{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;max-width:700px}
.feature{text-align:left}
.icon{width:55px;height:55px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(15,103,218,.34);border:1px solid rgba(65,190,255,.15);color:#28ddff;font-size:25px;margin-bottom:11px}
.feature b{font-size:14px;display:block;margin-bottom:6px}
.feature small{font-size:12px;color:#c1d4ec;line-height:1.35;display:block}
.card{
  width:min(500px,100%);justify-self:center;margin-top:4vh;
  background:rgba(255,255,255,.98);color:#173258;border-radius:22px;
  padding:28px 38px 24px;box-shadow:0 30px 90px rgba(0,0,0,.35)
}
.welcome{text-align:center;font-size:13px;letter-spacing:4px;font-weight:800;color:#71819a;margin-bottom:5px}
.card h2{text-align:center;font-size:29px;margin:0 0 6px;color:#102b52}
.hint{text-align:center;color:#71819a;font-size:14px;margin:0 0 17px}
label.field{display:block;font-size:13px;font-weight:800;color:#334b70;margin:10px 0 5px}
input[type=email],input[type=password],input[type=text]{
  width:100%;height:50px;border:1px solid #d7e1ee;border-radius:12px;
  padding:0 16px;font-size:16px;color:#1a3154;outline:none;background:#fff
}
input:focus{border-color:#1d62df;box-shadow:0 0 0 4px rgba(29,98,223,.10)}
.pass{position:relative}
.pass input{padding-right:52px}
.eye{position:absolute;right:7px;top:7px;width:38px;height:38px;border:0;background:transparent;color:#60738e;cursor:pointer;font-size:17px}
.row{display:flex;align-items:center;justify-content:space-between;margin:12px 0 14px;font-size:14px}
.remember{display:flex;align-items:center;gap:8px;color:#3d526f;font-weight:700}
.remember input{width:18px;height:18px;accent-color:#1670e8}
a{color:#1558da;text-decoration:none;font-weight:800}
#forgot{display:inline-block;padding:2px 0;white-space:nowrap}
button{font-family:inherit}
.primary,.secondary{width:100%;height:50px;border-radius:27px;font-size:16px;font-weight:800;cursor:pointer}
.primary{border:0;color:#fff;background:linear-gradient(90deg,#1265da,#1c43df);box-shadow:0 10px 24px rgba(24,88,218,.20)}
.primary:disabled{opacity:.65;cursor:wait}
.divider{display:flex;align-items:center;gap:14px;color:#9ba8ba;margin:14px 0;font-size:13px}
.divider:before,.divider:after{content:"";height:1px;background:#e1e7ef;flex:1}
.secondary{border:0;background:#edf4ff;color:#1257c9}
.msg{display:none;margin-top:14px;padding:11px 13px;border-radius:10px;font-size:13px;line-height:1.4}
.msg.show{display:block} .msg.error{background:#fff0f0;color:#a42b2b} .msg.success{background:#edfdf4;color:#197044}
.security{display:flex;justify-content:center;gap:7px;text-align:center;color:#7c8ba0;font-size:10px;margin-top:12px}
footer{position:fixed;z-index:3;left:7vw;right:7vw;bottom:18px;display:flex;justify-content:space-between;color:rgba(255,255,255,.58);font-size:11px}
footer span:first-child{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);white-space:nowrap;text-align:center}
@media(max-width:950px){
body{overflow:auto}
.page{height:auto;min-height:100vh;grid-template-columns:1fr;padding:35px 24px 70px;gap:35px}
.left{text-align:center;display:flex;flex-direction:column;align-items:center}
.logo{width:250px;margin-bottom:25px}
.topline,h1,.subtitle{text-align:center}
h1{font-size:42px}
.features{width:100%;max-width:650px}
.feature{text-align:center}
.icon{margin-left:auto;margin-right:auto}
.card{margin-top:0;width:min(500px,100%)}
footer{position:static;margin-top:10px;padding:0 24px 18px;gap:10px;flex-wrap:wrap}
}
@media(max-width:520px){
.page{padding:25px 17px 50px}
.logo{width:210px}
h1{font-size:34px}
.subtitle{font-size:17px}
.features{grid-template-columns:1fr 1fr;gap:18px}
.card{padding:30px 22px}
.card h2{font-size:27px}
}
</style>
</head>
