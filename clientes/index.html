<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clientes | Insight</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#17233d;font-family:Arial,sans-serif}
header{margin:14px;padding:25px 32px;border-radius:20px;background:linear-gradient(110deg,#17367d,#2863e6);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:20px}
h1{margin:0;font-size:40px}.sub{margin-top:8px;font-size:18px}.actions{display:flex;gap:9px;flex-wrap:wrap}
button{border:0;border-radius:11px;padding:12px 17px;font-weight:700;font-size:15px;cursor:pointer}.white{background:#fff;color:#17367d}
main{padding:0 14px 35px}.msg{display:none;margin:12px 0;padding:14px 16px;border-radius:10px;background:#fff1f1;color:#9d001d;border:1px solid #e6aab4}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:14px 0}.kpi{background:#fff;border:1px solid #d9e2ef;border-radius:17px;padding:20px}.kpi span{font-size:13px;font-weight:700;color:#68758c}.kpi b{display:block;font-size:32px;color:#173f91;margin-top:8px}
.toolbar{display:flex;gap:10px;margin:15px 0}.toolbar input,.toolbar select{width:100%;padding:13px;border:1px solid #cdd8e8;border-radius:10px;background:#fff;font-size:16px}.toolbar input{flex:1}.toolbar select{max-width:260px}
.tablewrap{overflow:auto;background:#fff;border-radius:17px;border:1px solid #d9e2ef}.table{width:100%;border-collapse:collapse;min-width:1000px}.table th{background:#0e1830;color:#fff;text-align:left;padding:14px}.table td{padding:13px;border-bottom:1px solid #e7edf5}.tag{display:inline-block;background:#d9f7e8;color:#087344;border-radius:99px;padding:6px 10px;font-weight:700;font-size:12px}
.empty{text-align:center;padding:35px;color:#68758c}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.open{display:flex}.box{background:#fff;border-radius:20px;width:min(1100px,100%);max-height:94vh;overflow:auto;padding:25px}.boxhead{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:700;color:#5e6c83;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #cdd8e8;border-radius:8px}.field textarea{min-height:75px}.full{grid-column:1/-1}.section{margin-top:22px;padding-top:16px;border-top:1px solid #e2e8f0}.contract{border:1px solid #dce4ef;border-radius:12px;padding:14px;margin:10px 0}.contractgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font-size:13px;margin-top:10px}.contractgrid b{display:block;color:#68758c;font-size:11px;margin-bottom:3px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.contractgrid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
<div><h1>Clientes</h1><div class="sub">Cadastro e ficha integrada de gestão do cliente</div></div>
<div class="actions">
<button class="white" id="btnNovo">＋ Novo cliente</button>
<button class="white" id="btnAtualizar">↻ Atualizar</button>
<button class="white" id="btnInicio">⌂ Início</button>
<button class="white" id="btnSair">↪ Sair</button>
</div>
</header>
<main>
<div id="msg" class="msg"></div>
<div class="kpis">
<div class="kpi"><span>CLIENTES ATIVOS</span><b id="kAtivos">0</b></div>
<div class="kpi"><span>CLIENTES CADASTRADOS</span><b id="kTotal">0</b></div>
<div class="kpi"><span>PROSPECTS</span><b id="kProspects">0</b></div>
<div class="kpi"><span>CONTRATOS ATIVOS</span><b id="kContratos">0</b></div>
</div>
<div class="toolbar">
<input id="busca" placeholder="Pesquisar razão social, nome fantasia, CNPJ, contato ou responsável...">
<select id="filtro"><option value="">Todos os status</option><option>ATIVO</option><option>INATIVO</option><option>PROSPECT</option></select>
</div>
<div class="tablewrap"><table class="table"><thead><tr>
<th>ID CLIENTE</th><th>RAZÃO SOCIAL</th><th>CNPJ</th><th>NOME FANTASIA</th><th>CONTATO</th><th>E-MAIL</th><th>RESPONSÁVEL</th><th>STATUS</th><th>AÇÃO</th>
</tr></thead><tbody id="corpo"></tbody></table></div>
</main>

<div class="modal" id="modal">
<div class="box">
<div class="boxhead"><h2 id="tituloModal">Ficha do Cliente</h2><button id="btnFechar">✕</button></div>
<input type="hidden" id="clienteId">
<div class="grid">
<div class="field"><label>ID CLIENTE</label><input id="fId"></div>
<div class="field"><label>RAZÃO SOCIAL</label><input id="fRazao"></div>
<div class="field"><label>CNPJ</label><input id="fCnpj"></div>
<div class="field"><label>NOME FANTASIA</label><input id="fFantasia"></div>
<div class="field"><label>CONTATO</label><input id="fContato"></div>
<div class="field"><label>E-MAIL</label><input id="fEmail"></div>
<div class="field"><label>RESPONSÁVEL</label><input id="fResponsavel"></div>
<div class="field"><label>STATUS</label><select id="fStatus"><option>ATIVO</option><option>INATIVO</option><option>PROSPECT</option></select></div>
</div>
<div class="foot"><button id="btnSalvarCliente">Salvar cliente</button></div>
<div class="section"><h3>Contratos do cliente</h3><div id="listaContratos">Carregando...</div></div>
</div>
</div>

<script>
(function(){
'use strict';

const SUPABASE_URL = 'https://sayeyuyampbsmhhdukzv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ehw8AIkVTS6k6iI2Rh9nJ1w_2S6Au_GA';
window.SUPABASE_CLIENT = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let usuario = null;
let clientes = [];
let contratos = [];
let clienteSelecionado = null;

const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const moeda = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0));

function erro(texto){
  const el=$('msg'); el.textContent=texto; el.style.display='block';
}
function limparErro(){ $('msg').style.display='none'; }

async function carregar(){
  limparErro();
  const sb=window.SUPABASE_CLIENT;
  const sess=await sb.auth.getUser();
  if(sess.error) throw sess.error;
  usuario=sess.data.user;
  if(!usuario){ window.location.href='../'; return; }

  const cr=await sb.from('clientes').select('*').eq('user_id',usuario.id).order('id_cliente');
  if(cr.error) throw new Error('Clientes: '+cr.error.message);
  clientes=cr.data||[];

  const tr=await sb.from('contratos').select('*').eq('user_id',usuario.id);
  if(tr.error) throw new Error('Contratos: '+tr.error.message);
  contratos=tr.data||[];

  render();
}

function render(){
  const q=$('busca').value.trim().toLowerCase();
  const f=$('filtro').value;
  const lista=clientes.filter(x=>{
    const texto=[x.id_cliente,x.razao_social,x.cnpj,x.nome_fantasia,x.contato,x.email,x.responsavel].join(' ').toLowerCase();
    return (!f || x.status===f) && (!q || texto.includes(q));
  });

  $('kAtivos').textContent=clientes.filter(x=>x.status==='ATIVO').length;
  $('kTotal').textContent=clientes.length;
  $('kProspects').textContent=clientes.filter(x=>x.status==='PROSPECT').length;
  $('kContratos').textContent=contratos.filter(x=>x.status==='ATIVO').length;

  $('corpo').innerHTML=lista.length ? lista.map(x=>`
    <tr>
      <td>${esc(x.id_cliente)}</td><td><b>${esc(x.razao_social)}</b></td>
      <td>${esc(x.cnpj)}</td><td>${esc(x.nome_fantasia)}</td><td>${esc(x.contato)}</td>
      <td>${esc(x.email)}</td><td>${esc(x.responsavel)}</td>
      <td><span class="tag">${esc(x.status)}</span></td>
      <td><button data-id="${esc(x.id)}" class="abrir">Abrir ficha</button></td>
    </tr>`).join('')
    : '<tr><td colspan="9" class="empty">Nenhum cliente encontrado.</td></tr>';

  document.querySelectorAll('.abrir').forEach(b=>b.addEventListener('click',()=>abrirFicha(b.dataset.id)));
}

function abrirFicha(id){
  clienteSelecionado=clientes.find(x=>x.id===id);
  if(!clienteSelecionado) return;
  $('clienteId').value=clienteSelecionado.id;
  $('fId').value=clienteSelecionado.id_cliente||'';
  $('fRazao').value=clienteSelecionado.razao_social||'';
  $('fCnpj').value=clienteSelecionado.cnpj||'';
  $('fFantasia').value=clienteSelecionado.nome_fantasia||'';
  $('fContato').value=clienteSelecionado.contato||'';
  $('fEmail').value=clienteSelecionado.email||'';
  $('fResponsavel').value=clienteSelecionado.responsavel||'';
  $('fStatus').value=clienteSelecionado.status||'ATIVO';

  const cs=contratos.filter(c=>c.cliente_id===clienteSelecionado.id);
  $('listaContratos').innerHTML=cs.length ? cs.map(c=>`
    <div class="contract">
      <b>${esc(c.numero_contrato||'Sem número')} — ${esc(c.servico||'Sem serviço')}</b>
      <div class="contractgrid">
        <div><b>TIPO</b>${esc(c.tipo_contrato)}</div>
        <div><b>STATUS</b>${esc(c.status)}</div>
        <div><b>INÍCIO</b>${esc(c.inicio_vigencia)}</div>
        <div><b>FIM</b>${esc(c.fim_vigencia)}</div>
        <div><b>VALOR MENSAL</b>${moeda(c.valor_mensal)}</div>
        <div><b>PAGAMENTO</b>${esc(c.forma_pagamento)} — dia ${esc(c.dia_vencimento)}</div>
        <div><b>ARQUIVO</b>${c.arquivo_url?`<a href="${esc(c.arquivo_url)}" target="_blank">Abrir documento</a>`:'—'}</div>
        <div><b>PENDÊNCIAS</b>${esc(c.pendencias)||'Nenhuma'}</div>
        <div><b>PRÓXIMA AÇÃO</b>${esc(c.proxima_acao)||'—'} ${esc(c.proxima_acao_data)||''}</div>
      </div>
    </div>`).join('') : '<p>Nenhum contrato vinculado a este cliente.</p>';

  $('modal').classList.add('open');
}

async function salvarCliente(){
  if(!clienteSelecionado) return;
  const obj={
    id_cliente:$('fId').value.trim(),razao_social:$('fRazao').value.trim(),
    cnpj:$('fCnpj').value.trim(),nome_fantasia:$('fFantasia').value.trim(),
    contato:$('fContato').value.trim(),email:$('fEmail').value.trim(),
    responsavel:$('fResponsavel').value.trim(),status:$('fStatus').value
  };
  const r=await window.SUPABASE_CLIENT.from('clientes').update(obj).eq('id',clienteSelecionado.id).eq('user_id',usuario.id);
  if(r.error){alert(r.error.message);return;}
  $('modal').classList.remove('open');
  await carregar();
}

$('btnAtualizar').addEventListener('click',carregar);
$('busca').addEventListener('input',render);
$('filtro').addEventListener('change',render);
$('btnFechar').addEventListener('click',()=> $('modal').classList.remove('open'));
$('btnSalvarCliente').addEventListener('click',salvarCliente);
$('btnNovo').addEventListener('click',()=>alert('O cadastro de novo cliente será ativado na próxima etapa.'));
$('btnInicio').addEventListener('click',()=>window.location.href='../');
$('btnSair').addEventListener('click',async()=>{await window.SUPABASE_CLIENT.auth.signOut();window.location.href='../';});

window.addEventListener('DOMContentLoaded',async()=>{
  try{await carregar();}
  catch(e){erro('Erro ao carregar o módulo: '+(e.message||e));console.error(e);}
});
})();
</script>
</body>
</html>
